<!-- ===================HOW IT'S WORK========================= -->
<section data-opai-animate data-delay="0.1" class="py-16 md:py-28 lg:py-36 xl:py-44 2xl:py-50">
  <div class="main-container space-y-8 md:space-y-14">
    <!-- Content Section -->
    <div class="space-y-3 pb-4 text-center">
      <!-- Tagline Badge -->
      <div data-opai-animate data-delay="0.1">
        <Component
          src="src/components/home/badge.htm"
          text="How it's work"
          class="!border-transparent !bg-white/50 max-md:!mb-0"
        />
      </div>

      <h2
        class="font-manrope text-manrope-heading-4 md:text-manrope-heading-3 lg:text-manrope-heading-2 text-background-13/90 font-medium max-md:leading-[1.1]"
        data-opai-animate
        data-delay="0.2"
      >
        So, how does

        <span class="font-instrument-serif text-background-13/30 italic">Nexsas work? </span>
      </h2>
    </div>

    <!-- How it's work cards -->
    <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
      <!-- card 01 -->
      <div
        class="min-h-[404px] rounded-xl bg-white p-2 backdrop-blur-[30px]"
        data-opai-animate
        data-delay="0.1"
      >
        <div
          class="bg-background-7 flex h-full flex-col justify-between space-y-8 rounded-lg p-7 md:p-10.5"
        >
          <div class="font-instrument-serif text-is-heading-4 text-black">1</div>

          <div
            class="how-its-work-images-container relative -z-0 flex items-end justify-center -space-x-4"
          >
            <figure
              class="how-its-work-image-1 h-full max-h-24.5 w-full max-w-20.5 -translate-y-3 -rotate-[20deg] overflow-hidden rounded-[4px]"
            >
              <img src="./images/opai-img-31.png" alt="CTA Img" class="size-full object-cover" />
            </figure>
            <figure
              class="how-its-work-image-2 h-full max-h-24.5 w-full max-w-20.5 rotate-[20deg] overflow-hidden rounded-[4px]"
            >
              <img src="./images/opai-img-32.png" alt="CTA Img" class="size-full object-cover" />
            </figure>
            <figure
              class="how-its-work-image-3 relative z-10 h-full max-h-24.5 w-full max-w-20.5 -translate-y-7 -rotate-[8deg] overflow-hidden rounded-[4px]"
            >
              <img src="./images/opai-img-33.png" alt="CTA Img" class="size-full object-cover" />
            </figure>
            <figure
              class="how-its-work-image-4 h-full max-h-24.5 w-full max-w-20.5 -translate-y-0 rotate-[19deg] overflow-hidden rounded-[4px]"
            >
              <img src="./images/opai-img-34.png" alt="CTA Img" class="size-full object-cover" />
            </figure>
          </div>
          <div>
            <h3 class="font-instrument-serif text-is-heading-5 text-black">Select a template</h3>
            <p class="font-inter-tight text-tagline-2 text-background-13/50 max-w-[250px]">
              Start fast with prebuilt structures or blank canvases.
            </p>
          </div>
        </div>
      </div>
      <!-- card 02 -->
      <div
        class="min-h-[404px] rounded-xl bg-white p-2 backdrop-blur-[30px]"
        data-opai-animate
        data-delay="0.2"
      >
        <div
          class="bg-background-7 flex h-full flex-col justify-between space-y-8 rounded-lg p-7 md:p-10.5"
        >
          <div class="font-instrument-serif text-is-heading-4 text-black">2</div>

          <div
            class="bg-background-6 border-stroke-3/11 relative overflow-hidden rounded-xl border p-2"
          >
            <!-- gradient  -->
            <div class="pointer-events-none absolute -top-[50%] -left-[10%] z-5 size-20">
              <div
                class="absolute h-full w-full rounded-[80.023px] blur-[16.56px]"
                style="background: linear-gradient(90deg, #ee9ca7 0%, #ffdde1 100%); opacity: 0.6"
              ></div>
              <div
                class="absolute top-3 left-3 h-[70%] w-[70%] rounded-[42.896px] blur-[6.785px]"
                style="background: linear-gradient(90deg, #f2709c 0%, #ff9472 100%); opacity: 0.7"
              ></div>
            </div>

            <div class="relative z-10">
              <input
                type="text"
                placeholder="Enter your prompt"
                class="placeholder:text-tagline-3 text-tagline-3 font-inter-tight w-full rounded-lg border border-white/3 bg-white/5 px-4 py-2 font-normal text-white/90 backdrop-blur-[32px] placeholder:text-white focus:ring-1 focus:ring-white/10 focus:outline-none"
              />

              <div
                class="pointer-events-none absolute top-0 right-4 h-[0.5px] w-10 rounded-full bg-radial-[circle,#FFFFFF_0%,#FFFFFF00_100%] opacity-30 transition-all duration-500 ease-out"
              ></div>
            </div>
          </div>
          <div>
            <h3 class="font-instrument-serif text-is-heading-5 text-black">Create context</h3>
            <p class="font-inter-tight text-tagline-2 text-background-13/50 max-w-[250px]">
              Add goals, keywords, or styles.
            </p>
          </div>
        </div>
      </div>
      <!-- card 03 -->
      <div
        class="min-h-[404px] rounded-xl bg-white p-2 backdrop-blur-[30px]"
        data-opai-animate
        data-delay="0.3"
      >
        <div
          class="bg-background-7 relative flex h-full flex-col justify-between space-y-8 overflow-hidden rounded-lg p-7 md:p-10.5"
        >
          <!-- gradient  -->
          <div class="pointer-events-none absolute -top-[50%] -right-[50%] z-5 size-[378px]">
            <div
              class="absolute h-full w-full rounded-[378.023px] blur-[56.56px]"
              style="background: linear-gradient(90deg, #ee9ca7 0%, #ffdde1 100%)"
            ></div>
            <div
              class="absolute top-3 left-3 h-[70%] w-[70%] rounded-[42.896px] blur-[32.785px]"
              style="background: linear-gradient(90deg, #f2709c 0%, #ff9472 100%)"
            ></div>
          </div>

          <div class="font-instrument-serif text-is-heading-4 text-black">3</div>

          <div class="bg-background-6 border-stroke-3/11 relative z-10 rounded-xl border p-2">
            <div class="relative z-10">
              <div
                class="w-full rounded-lg border border-white/3 bg-white/5 px-4 py-2 font-normal text-white/90 backdrop-blur-[32px]"
              >
                <img
                  src="./images/vactor-shape/vactor-09.svg"
                  alt="AI Image"
                  class="size-full object-cover px-4 py-2"
                />
              </div>

              <div
                class="pointer-events-none absolute top-0 right-4 h-[0.5px] w-10 rounded-full bg-radial-[circle,#FFFFFF_0%,#FFFFFF00_100%] opacity-30 transition-all duration-500 ease-out"
              ></div>
            </div>
          </div>
          <div>
            <h3 class="font-instrument-serif text-is-heading-5 text-black">Browse results</h3>
            <p class="font-inter-tight text-tagline-2 text-background-13/50 max-w-[250px]">
              View drafts, edit with ease, or export to your favorite tools.
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Button -->
    <div class="flex justify-center" data-opai-animate data-delay="0.1">
      <Component
        src="src/components/shared/button-primary.htm"
        button-text="Get started now"
        anchor-link="./process.html"
      />
    </div>
  </div>
</section>
