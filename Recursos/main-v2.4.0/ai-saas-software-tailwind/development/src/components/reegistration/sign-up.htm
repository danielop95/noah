<!-- =========================
Sign Up
===========================-->
<section class="pt-28 pb-39 md:pt-36 lg:pt-54">
  <div class="main-container">
    <div class="flex flex-col items-center gap-10 md:gap-16">
      <!-- Content Section -->

      <div class="space-y-1.5 text-center md:space-y-3">
        <h2
          class="font-sora text-sora-heading-4 md:text-sora-heading-3 lg:text-sora-heading-2 text-background-13/90 font-normal tracking-[-2.4px] max-md:leading-[1.2]"
          data-opai-animate
          data-delay="0.1"
        >
          Let's get started
        </h2>
        <p
          class="font-inter-tight text-tagline-2 text-background-13/60 mx-auto md:max-w-[350px]"
          data-opai-animate
          data-delay="0.2"
        >
          Let's explore how Nexsas can support your goals with AI-driven solutions.
        </p>
      </div>

      <!-- Form Container -->
      <div
        class="bg-background-8 w-full max-w-[413px] rounded-xl p-2"
        data-opai-animate
        data-delay="0.1"
      >
        <form
          action="#"
          class="bg-background-7 flex flex-col items-center gap-8 rounded-lg px-8 py-6 backdrop-blur-[60px] md:px-8 md:py-8"
        >
          <div class="flex w-full flex-col gap-8">
            <!-- Fields -->
            <div class="flex flex-col gap-4">
              <fieldset class="space-y-2">
                <label
                  for="signup-username"
                  class="font-inter-tight text-tagline-2 text-background-13/90 block"
                >
                  Username
                </label>
                <input
                  type="text"
                  id="signup-username"
                  name="username"
                  placeholder="Your name"
                  class="border-stroke-3/25 focus-within:border-stroke-3/50 text-background-13/90 placeholder:text-background-13/60 w-full rounded-md border bg-transparent px-4.5 py-3 focus-within:outline-none"
                  required
                  aria-label="Username"
                />
              </fieldset>
              <fieldset class="space-y-2">
                <label
                  for="signup-email"
                  class="font-inter-tight text-tagline-2 text-background-13/90 block"
                >
                  Your email
                </label>
                <input
                  type="email"
                  id="signup-email"
                  name="email"
                  placeholder="Email address"
                  class="border-stroke-3/25 focus-within:border-stroke-3/50 text-background-13/90 placeholder:text-background-13/60 w-full rounded-md border bg-transparent px-4.5 py-3 focus-within:outline-none"
                  required
                  aria-label="Your email"
                />
              </fieldset>
              <fieldset class="space-y-2">
                <label
                  for="signup-password"
                  class="font-inter-tight text-tagline-2 text-background-13/90 block"
                >
                  Password
                </label>
                <input
                  type="password"
                  id="signup-password"
                  name="password"
                  placeholder="At least 8 character"
                  class="border-stroke-3/25 focus-within:border-stroke-3/50 text-background-13/90 placeholder:text-background-13/60 w-full rounded-md border bg-transparent px-4.5 py-3 focus-within:outline-none"
                  required
                  minlength="8"
                  aria-label="Password"
                />
              </fieldset>
              <fieldset class="space-y-2">
                <label
                  for="signup-confirm-password"
                  class="font-inter-tight text-tagline-2 text-background-13/90 block"
                >
                  Confirm Password
                </label>
                <input
                  type="password"
                  id="signup-confirm-password"
                  name="confirm-password"
                  placeholder="Re-enter your password"
                  class="border-stroke-3/25 focus-within:border-stroke-3/50 text-background-13/90 placeholder:text-background-13/60 w-full rounded-md border bg-transparent px-4.5 py-3 focus-within:outline-none"
                  required
                  aria-label="Confirm Password"
                />
              </fieldset>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="group/btn-primary bg-background-14 hover:border-stroke-3/20 hover:bg-background-14/95 relative flex h-full max-h-12 items-center justify-center gap-2 overflow-hidden rounded-[4px] border border-transparent px-6 py-[13px] transition-all duration-300 ease-in-out"
            >
              <!-- gradient sliding  -->

              <div
                class="pointer-events-none absolute top-1/2 left-[-67%] size-full -translate-y-1/2 rotate-75 bg-linear-[180deg,hsla(21,63%,73%,0),hsla(0,0%,100%,0.2)_50%,hsla(21,63%,73%,0)] transition-none will-change-[left] group-hover/btn-primary:left-[70%] group-hover/btn-primary:transition-[left] group-hover/btn-primary:duration-800 group-hover/btn-primary:ease-in-out"
              ></div>

              <span class="text-background-7 font-ibm-plex-mono text-tagline-2"> Sign Up </span>

              <!-- arrow icon  -->
              <div
                class="relative mt-[2.3px] flex size-6 items-center justify-center overflow-hidden"
              >
                <span
                  class="ease-custom-ease-1 absolute translate-x-0 opacity-100 transition-all duration-500 group-hover/btn-primary:translate-x-6 group-hover/btn-primary:opacity-0"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 18 18"
                    fill="none"
                  >
                    <path
                      d="M6.75 13.5L11.25 9L6.75 4.5"
                      stroke="white"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                <span
                  class="ease-custom-ease-1 absolute -translate-x-6 opacity-0 transition-all duration-500 group-hover/btn-primary:translate-x-0 group-hover/btn-primary:opacity-100"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 18 18"
                    fill="none"
                  >
                    <path
                      d="M6.75 13.5L11.25 9L6.75 4.5"
                      stroke="white"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
              </div>
            </button>

            <!-- Or divider -->
            <div class="relative flex items-center justify-center gap-2">
              <span
                class="block h-px w-[43px] shrink-0 bg-[linear-gradient(270deg,rgba(13,16,23,0.4)_0%,rgba(13,16,23,0)_79%)]"
              ></span>
              <span class="font-inter-tight text-tagline-4 text-background-13/90">Or</span>
              <span
                class="block h-px w-[43px] shrink-0 bg-[linear-gradient(90deg,rgba(13,16,23,0.4)_0%,rgba(13,16,23,0)_79%)]"
              ></span>
            </div>

            <!-- Social buttons -->
            <div class="flex flex-col gap-6">
              <a
                href="#"
                class="border-stroke-3/25 hover:bg-stroke-3/25 flex w-full items-center justify-center gap-2 rounded-md border px-8 py-3 transition-colors duration-300"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  class="size-6 shrink-0"
                >
                  <path
                    d="M21.7541 12.2199C21.7541 11.4182 21.6878 10.8332 21.5441 10.2266H12.2031V13.8449H17.6861C17.5756 14.744 16.9786 16.0982 15.6521 17.0082L15.6335 17.1293L18.5869 19.3715L18.7915 19.3916C20.6708 17.6907 21.7541 15.1882 21.7541 12.2199Z"
                    fill="#4285F4"
                  />
                  <path
                    d="M12.2002 21.7514C14.8864 21.7514 17.1415 20.8847 18.7886 19.3897L15.6492 17.0063C14.8091 17.5805 13.6815 17.9813 12.2002 17.9813C9.56932 17.9813 7.33635 16.2805 6.54036 13.9297L6.42369 13.9394L3.35266 16.2686L3.3125 16.378C4.94853 19.563 8.30907 21.7514 12.2002 21.7514Z"
                    fill="#34A853"
                  />
                  <path
                    d="M6.53907 13.9306C6.32904 13.3239 6.20749 12.6739 6.20749 12.0023C6.20749 11.3305 6.32904 10.6806 6.52802 10.0739L6.52246 9.94471L3.41294 7.57812L3.3112 7.62555C2.63691 8.94723 2.25 10.4314 2.25 12.0023C2.25 13.5731 2.63691 15.0572 3.3112 16.3789L6.53907 13.9306Z"
                    fill="#FBBC05"
                  />
                  <path
                    d="M12.2003 6.01997C14.0685 6.01997 15.3286 6.8108 16.0472 7.47168L18.855 4.785C17.1306 3.21417 14.8865 2.25 12.2003 2.25C8.3091 2.25 4.94854 4.43832 3.3125 7.62329L6.52933 10.0717C7.33638 7.72083 9.56936 6.01997 12.2003 6.01997Z"
                    fill="#EB4335"
                  />
                </svg>
                <span class="font-inter-tight text-tagline-3 text-background-13/90"
                  >Continue with Google</span
                >
              </a>
              <a
                href="#"
                class="border-stroke-3/25 hover:bg-stroke-3/25 flex w-full items-center justify-center gap-2 rounded-md border px-8 py-3 transition-colors duration-300"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  class="size-6 shrink-0"
                >
                  <path
                    d="M22.5 12.0642C22.5 6.22974 17.799 1.5 12 1.5C6.20101 1.5 1.5 6.22974 1.5 12.0642C1.5 17.337 5.33968 21.7075 10.3594 22.5V15.1179H7.69336V12.0642H10.3594V9.73675C10.3594 7.08911 11.927 5.62663 14.3254 5.62663C15.4738 5.62663 16.6758 5.83296 16.6758 5.83296V8.43274H15.3518C14.0475 8.43274 13.6406 9.24713 13.6406 10.0834V12.0642H16.5527L16.0872 15.1179H13.6406V22.5C18.6603 21.7075 22.5 17.337 22.5 12.0642Z"
                    fill="#0C63D4"
                  />
                </svg>
                <span class="font-inter-tight text-tagline-3 text-background-13/90"
                  >Continue with Facebook</span
                >
              </a>
            </div>
          </div>

          <p class="font-inter-tight text-tagline-3 text-background-13/90 text-center">
            Already have an account?
            <a href="login.html" class="text-background-1/70 underline">Login</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
