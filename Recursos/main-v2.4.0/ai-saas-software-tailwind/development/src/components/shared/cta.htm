        class="items-top relative flex h-[200px] justify-center max-sm:scale-70 sm:h-[280px]"
      >
        <!-- Slides -->
        <figure class="absolute transition-all duration-700 ease-in-out">
          <img
            src="./images/opai-avatar-img-26.png"
            alt="cta"
            class="h-full w-full rounded-lg object-cover"
          />
        </figure>
        <figure class="absolute transition-all duration-700 ease-in-out">
          <img
            src="./images/opai-avatar-img-27.png"
            alt="cta"
            class="h-full w-full rounded-lg object-cover"
          />

        <figure class="absolute transition-all duration-700 ease-in-out">
          <img
            src="./images/opai-avatar-img-28.png"
            alt="cta"
            class="h-full w-full rounded-lg object-cover"
          />
        </figure>
        <figure class="absolute transition-all duration-700 ease-in-out">
          <img
            src="./images/opai-avatar-img-29.png"
            alt="cta"
            class="h-full w-full rounded-lg object-cover"
          />
        </figure>
        <figure class="absolute transition-all duration-700 ease-in-out">
          <img
            src="./images/opai-avatar-img-30.png"

            class="h-full w-full rounded-lg object-cover"
          />

    </div>

    <div class="space-y-3">

        data-delay="0.1"
      >
        Ready to accelerate Your
        <span
          class="text-is-heading-4 md:text-is-heading-3 lg:text-is-heading-2 text-background-13/60 font-normal italic max-md:leading-[1.1]"

      <p
        class="text-tagline-2 text-background-13/50 mx-auto w-full max-w-[320px] text-center"

      >

      </p>
    </div>

    <!-- Button -->
    <div class="flex justify-center" data-opai-animate data-delay="0.1">
      <Component
        src="src/components/shared/button-primary.htm"
