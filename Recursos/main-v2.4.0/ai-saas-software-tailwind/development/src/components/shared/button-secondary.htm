<a
  href="{=$anchor-link}"
  class="group/btn-secondary bg-background-7 hover:border-stroke-3/20 hover:bg-background-7/95 {=$class} relative flex h-full max-h-12 items-center justify-center gap-2 overflow-hidden rounded-[4px] border border-transparent px-6 py-[13px] transition-all duration-300 ease-in-out"
>
  <!-- gradient sliding  -->

  <div
    class="pointer-events-none absolute top-1/2 left-[-67%] size-full -translate-y-1/2 rotate-75 bg-linear-[180deg,hsla(21,63%,73%,0.1),hsla(0,0%,16%,0.17)_45%,hsla(0,0%,16%,0.09)_50%,hsla(21,63%,73%,0.1)] transition-none will-change-[left] group-hover/btn-secondary:left-[70%] group-hover/btn-secondary:transition-[left] group-hover/btn-secondary:duration-800 group-hover/btn-secondary:ease-in-out"
  ></div>

  <span class="text-background-14 font-ibm-plex-mono text-tagline-2 font-medium">
    {=$button-text}
  </span>

  <!-- arrow icon  -->
  <div class="relative mt-[2.3px] flex size-6 items-center justify-center overflow-hidden">
    <span
      class="ease-custom-ease-1 absolute translate-x-0 opacity-100 transition-all duration-500 group-hover/btn-secondary:translate-x-6 group-hover/btn-secondary:opacity-0"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
      >
        <path
          d="M6.75 13.5L11.25 9L6.75 4.5"
          stroke="var(--color-background-14)"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <span
      class="ease-custom-ease-1 absolute -translate-x-6 opacity-0 transition-all duration-500 group-hover/btn-secondary:translate-x-0 group-hover/btn-secondary:opacity-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
      >
        <path
          d="M6.75 13.5L11.25 9L6.75 4.5"
          stroke="var(--color-background-14)"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  </div>
</a>
