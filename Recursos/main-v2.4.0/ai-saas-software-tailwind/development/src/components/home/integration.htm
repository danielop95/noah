<section class="py-24 md:py-32 lg:py-40 xl:py-44">
  <div class="main-container">
    <div class="mx-auto max-w-[804px] space-y-24">
      <div class="space-y-1.5 text-center md:space-y-3">
        <div data-opai-animate data-delay="0.1">
          <Component src="src/components/home/badge.htm" text="Partners" />
        </div>
        <h2
          data-opai-animate
          data-delay="0.2"
          class="font-manrope text-manrope-heading-4 md:text-manrope-heading-3 lg:text-manrope-heading-2 text-background-13/90 font-medium max-md:leading-[1.2]"
        >
          Businesses around the world <br class="hidden md:block" />
          <span class="font-instrument-serif text-background-13/30 italic">rely on Nexsas</span>
        </h2>
        <p
          data-opai-animate
          data-delay="0.3"
          class="text-tagline-2 font-inter-tight text-background-13/60 mx-auto max-w-[400px] font-normal"
        >
          Nexsas works with your favorite tools [Canva, Figma, Notion, Zapier, Shopify, Google
          Drive, etc.
        </p>
      </div>
      <!-- svg Integration Part -->
      <div
        class="relative mx-auto h-[320px] max-w-full pb-12 sm:h-[380px] md:h-[424px] md:max-w-[804px]"

        data-delay="0.1"
      >
        <!-- SVG lines -->
        <svg
          class="integration-path absolute inset-0 h-full w-full"
          viewBox="0 0 1000 500"
          preserveAspectRatio="xMidYMid meet"
        >
          <g transform="translate(449,240) scale(1.5) translate(-227,-147.703)">
            <!-- left TOP (Figma) ends at (227,147.703) -> now aligned to (500,250) -->
            <path
              class="stroke-stroke-3/10 fill-none stroke-1"
              d="M227 147.703H192.062C172.52 147.703 154.769 136.319 146.619 118.558L105.908 29.8482C97.7568 12.0876 80.006 0.703125 60.4644 0.703125H0"
            />
          </g>

          <g transform="translate(500,250) scale(1.7) translate(-227,0)">
            <!-- left MIDDLE (Figma) ends at (227,0.703) -> aligned horizontally to center -->
            <path class="stroke-stroke-3/10 fill-none stroke-1" d="M227 0.703125H0" />
          </g>

          <!-- LEFT BOTTOM (now using actual Figma bottom path) -->
          <g transform="translate(450,262) scale(1.5) translate(-227,0)">
            <path
              class="stroke-stroke-3/10 fill-none stroke-1"
              d="M227 0.703132H192.062C172.52 0.703132 154.769 12.0876 146.619 29.8482L105.908 118.558C97.7568 136.319 80.006 147.703 60.4644 147.703H0"
            />
          </g>

          <!-- RIGHT TOP -->
          <g transform="translate(555,238) scale(1.5) translate(0,-147.703)">
            <path
              class="stroke-stroke-3/10 fill-none stroke-1"
              d="M0 147.703H34.9383C54.4799 147.703 72.2306 136.319 80.3814 118.558L121.092 29.8482C129.243 12.0876 146.994 0.703125 166.536 0.703125H227"
            />
          </g>

          <!-- RIGHT MIDDLE -->
          <g transform="translate(500,250) scale(1.7) translate(0,0)">
            <path class="stroke-stroke-3/10 fill-none stroke-1" d="M0 0.703125H227" />
          </g>

          <!-- RIGHT BOTTOM -->
          <g transform="translate(566,263) scale(1.5) translate(0,0)">
            <path
              class="stroke-stroke-3/10 fill-none stroke-1"
              d="M-4.52995e-06 0.703132H34.9383C54.4799 0.703132 72.2306 12.0876 80.3814 29.8482L121.092 118.558C129.243 136.319 146.994 147.703 166.536 147.703H227"
            />
          </g>
        </svg>

        <!-- Center -->

          class="border-stroke-3/10 absolute top-1/2 left-1/2 size-[80px] -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full border bg-white backdrop-blur-[20px] md:size-[160px] lg:size-[176px]"
        >
          <div
            class="border-stroke-3/10 absolute top-1/2 left-1/2 size-[90px] -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full border md:size-[120px] lg:size-[136px]"
          >
            <figure
              class="absolute top-1/2 left-1/2 grid size-20 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full bg-[linear-gradient(90deg,_#1CD8D2_0%,_#93EDC7_100%)] backdrop-blur-[20px] lg:size-24"
            >
              <img src="./images/opai-img-36.png" alt="Nexsas" class="size-11 lg:size-[54px]" />
            </figure>
          </div>
        </div>

        <!-- Left nodes -->
        <div
          class="border-stroke-3/10 bg-background-7 absolute top-[8%] left-0 z-10 grid size-16 place-items-center rounded-4xl border sm:size-24 md:-top-[7%] md:size-28"
        >
          <div
            class="border-stroke-3/10 absolute top-1/2 left-1/2 size-12 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-3xl border sm:size-20 md:size-23"
          ></div>
          <figure class="bg-background-9 size-11 rounded-2xl sm:size-16 md:size-18">
            <img
              class="size-full object-cover p-3.5"
              src="./images/icons/telegram.svg"
              alt="telegram"
            />

        </div>
        <div
          class="border-stroke-3/10 bg-background-7 absolute top-1/2 left-0 z-10 grid size-16 -translate-y-1/2 place-items-center rounded-4xl border sm:size-24 md:size-28"

            class="border-stroke-3/10 absolute top-1/2 left-1/2 size-12 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-3xl border sm:size-20 md:size-23"

          <figure class="bg-background-9 size-11 rounded-2xl sm:size-16 md:size-18">
            <img
              class="size-full object-cover p-3.5"

              alt="google meet"
            />

        </div>
        <div
          class="border-stroke-3/10 bg-background-7 absolute bottom-[8%] left-0 z-10 grid size-16 place-items-center rounded-4xl border sm:size-24 md:-bottom-[7%] md:size-28"
        >
          <div
            class="border-stroke-3/10 absolute top-1/2 left-1/2 size-12 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-3xl border sm:size-20 md:size-23"
          ></div>
          <figure class="bg-background-9 size-11 rounded-2xl sm:size-16 md:size-18">
            <img
              class="size-full object-cover p-3.5"
              src="./images/icons/notion.svg"
              alt="notion"
            />
          </figure>
        </div>

        <!-- Right nodes -->
        <div
          class="border-stroke-3/10 bg-background-7 absolute top-[8%] right-0 z-10 grid size-16 place-items-center rounded-4xl border sm:size-24 md:-top-[7%] md:size-28"

            class="border-stroke-3/10 absolute top-1/2 left-1/2 size-12 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-3xl border sm:size-20 md:size-23"
          ></div>
          <figure class="bg-background-9 size-11 rounded-2xl sm:size-16 md:size-18">
            <img
              class="size-full object-cover p-3.5"

            />
          </figure>
        </div>
        <div
          class="border-stroke-3/10 bg-background-7 absolute top-1/2 right-0 z-10 grid size-16 -translate-y-1/2 place-items-center rounded-4xl border sm:size-24 md:size-28"
        >
          <div
            class="border-stroke-3/10 absolute top-1/2 left-1/2 size-12 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-3xl border sm:size-20 md:size-23"

          <figure class="bg-background-9 size-11 rounded-2xl sm:size-16 md:size-18">

              class="size-full object-cover p-2.5 md:p-3.5"
              src="./images/icons/zoom.svg"

        </div>

      <!-- Button -->
      <div
        class="mx-auto flex w-[85%] items-center justify-center text-center md:w-auto"
        data-opai-animate
        data-delay="0.1"
      >
        <Component
          src="src/components/shared/button-primary.htm"
          button-text="View all services"
          anchor-link="./services.html"
        />
      </div>
    </div>
  </div>
</section>
