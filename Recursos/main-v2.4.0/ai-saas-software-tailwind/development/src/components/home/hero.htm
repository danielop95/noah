<!-- ============================ Hero Section ============================ -->
<section
  data-opai-animate
  data-delay="0.1"
  class="relative h-screen overflow-hidden pt-[120px] pb-[100px] lg:h-[150vh] lg:pt-[200px] xl:h-[180vh] xl:pt-[235px]"
>
  <!-- Background image -->
  <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
    <img
      src="/images/opai-img-123.jpg"
      alt=""
      class="size-full bg-cover bg-center bg-no-repeat object-cover object-top"
      loading="eager"
      fetchpriority="high"
    />
  </div>

  <div class="main-container space-y-19">
    <div class="space-y-1.5 text-center md:space-y-3">
      <h1
        class="text-manrope-heading-3 md:text-manrope-heading-2 lg:text-manrope-heading-1 text-background-13/90 font-medium"
        data-opai-animate
        data-delay="0.1"
      >
        Supercharge your
        <span
          class="md:text-is-heading-2 text-is-heading-3 lg:text-is-heading-1 text-background-13/60 font-normal italic max-lg:leading-[1.1]"
          >workflow <br class="hidden lg:block" />
          with Nexsas</span
        >
      </h1>
      <p
        class="text-tagline-1 text-background-13/60 font-normal"
        data-opai-animate
        data-delay="0.2"
      >
        An all-in-one AI SaaS platform for content creation, automation, and productivity
        <br class="hidden lg:block" />
        built for creators, teams, and businesses.
      </p>

      <div class="mt-14 inline-block text-center" data-opai-animate data-delay="0.3">
        <Component
          src="src/components/shared/button-primary.htm"
          button-text="Try for free"
          anchor-link="./login.html"
        />
      </div>
    </div>

    <figure
      class="overflow-hidden rounded-[18px] ring-8 ring-white/35 backdrop-blur-[47px]"
      data-opai-animate
      data-delay="0.5"
      data-scale="0.4"
      data-offset="20"
    >
      <img
        src="./images/opai-img-124.jpg"
        alt="hero"
        class="shadow-4 size-full rounded-xl object-cover"
      />
    </figure>
  </div>
</section>
