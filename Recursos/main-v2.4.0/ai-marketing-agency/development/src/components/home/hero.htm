<!-- ============================= Hero ============================= -->
<section

>

      <h1
        class="text-is-heading-3 md:text-is-heading-2 lg:text-is-heading-1 font-normal text-white/90 max-md:leading-[1.1]"

        data-delay="0.1"

        Intelligent, community-focused &
        <br class="hidden lg:block" />
        AI-powered marketing
      </h1>

        Your trusted local digital marketing agency, powered by data and AI.
        <br class="hidden lg:block" />
        We help businesses grow traffic, leads, and revenue faster.
      </p>
    </div>
    <div class="space-y-8 pt-13 lg:pt-18">
      <div class="flex justify-center" data-opai-animate data-delay="0.3">
        <Component
          src="src/components/shared/button/button-primary.htm"
          button-text="learn more"
          anchor-class="w-[80%] sm:w-auto"
          href="./about.html"
        />
      </div>

      <!-- Avatars and Trust Indicator -->
      <div class="flex items-center justify-center gap-4 max-[375px]:flex-col">
        <div class="flex -space-x-2.5">
          <img
            data-opai-avatar
            data-avatar-delay="0.1"
            class="inline-block size-9 rounded-full ring-2 ring-white"
            src="./images/opai-avatar-img-01.png"
            alt="Avatar 1"
          />
          <img
            data-opai-avatar
            data-avatar-delay="0.2"
            class="inline-block size-9 rounded-full ring-2 ring-white"
            src="./images/opai-avatar-img-02.png"
            alt="Avatar 2"
          />
          <img
            data-opai-avatar
            data-avatar-delay="0.3"
            class="inline-block size-9 rounded-full ring-2 ring-white"
            src="./images/opai-avatar-img-03.png"
            alt="Avatar 3"
          />
          <img
            data-opai-avatar
            data-avatar-delay="0.4"
            class="inline-block size-9 rounded-full ring-2 ring-white"
            src="./images/opai-avatar-img-04.png"
            alt="Avatar 4"
          />
          <div
            data-opai-avatar
            data-avatar-delay="0.5"
            class="text-tagline-4 inline-flex size-9 items-center justify-center rounded-full bg-[#0d0d1280] font-medium text-white/80 ring-2 ring-white backdrop-blur-[6px]"

            99+

        </div>
        <div class="text-left max-[375px]:text-center" data-opai-animate data-delay="0.4">
          <p class="text-tagline-3 block font-medium text-white/90">Trusted by 20k+</p>
          <p class="text-tagline-4 text-white/60">Customers across the globe</p>
        </div>

    </div>

    <div class="flex flex-wrap items-center justify-center gap-1 pt-10 sm:gap-4 md:pt-17 lg:pt-30">
      <a href="./service-details.html" data-opai-animate data-delay="0.1">
        <figure

          <img
            src="./images/opai-img-155.png"
            alt="hero-img"
            class="h-full w-full object-cover transition-all duration-300 ease-in-out group-hover:scale-110 group-hover:rotate-4"
          />

          <h3
            class="font-instrument-serif md:text-is-heading-5 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl text-nowrap text-white/90 opacity-90 transition-opacity duration-300 ease-in-out group-hover:opacity-100"
          >
            Customer Acquisition
          </h3>
        </figure>
      </a>
      <a href="./service-details.html" data-opai-animate data-delay="0.2">
        <figure
          class="group relative inline-block h-[90px] w-[220px] overflow-hidden rounded-[140px] lg:h-[120px] lg:w-[250px] xl:h-[150px] xl:w-[300px]"
        >
          <img
            src="./images/opai-img-156.png"
            alt="hero-img"
            class="h-full w-full object-cover transition-all duration-300 ease-in-out group-hover:scale-110 group-hover:rotate-4"
          />

          <h3
            class="font-instrument-serif md:text-is-heading-5 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl text-nowrap text-white/90 opacity-90 transition-opacity duration-300 ease-in-out group-hover:opacity-100"
          >
            Engagement
          </h3>
        </figure>
      </a>
      <a href="./service-details.html" data-opai-animate data-delay="0.3">
        <figure
          class="group relative inline-block h-[90px] w-[220px] overflow-hidden rounded-[140px] lg:h-[120px] lg:w-[250px] xl:h-[150px] xl:w-[300px]"
        >
          <img
            src="./images/opai-img-157.png"
            alt="hero-img"
            class="h-full w-full object-cover transition-all duration-300 ease-in-out group-hover:scale-110 group-hover:rotate-4"
          />

          <h3
            class="font-instrument-serif md:text-is-heading-5 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl text-nowrap text-white/90 opacity-90 transition-opacity duration-300 ease-in-out group-hover:opacity-100"
          >
            Sticking around
          </h3>
        </figure>
      </a>
    </div>
  </div>

  <!-- animate gradient -->
  <figure
    class="absolute bottom-0 left-1/2 z-0 h-full w-full max-w-[1390px] -translate-x-1/2 md:-bottom-10 lg:bottom-0"
  >
    <Component src="src/components/home/animate-gradient.htm" />

  <!-- Gradient Background -->
  <Component
    src="src/components/home/gradient-img.htm"
    image-path="./images/gradient/opai-2.png"

  />
