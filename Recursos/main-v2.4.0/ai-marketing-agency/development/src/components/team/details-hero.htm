<!-- team details hero section  -->
<section class="pt-28 md:pt-39">
  <div class="main-container">
    <div
      data-opai-animate
      data-delay="0.1"
      data-instant
      class="border-stroke-3/18 relative mx-auto w-full max-w-[850px] overflow-hidden rounded-xl border"
    >
      <!-- right bottom gradient  -->
      <div
        data-opai-animate
        data-delay="0.4"
        data-direction="right"
        data-offset="100"
        class="absolute right-0 bottom-0"
      >
        <figure class="size-[552px] overflow-hidden">
          <img src="./images/opai-img-47.svg" alt="gradient bg" class="size-full object-cover" />
        </figure>
      </div>

      <!-- hero img  -->
      <div class="relative z-10 space-y-4">
        <div
          class="mx-auto flex h-[500px] w-full items-end overflow-hidden rounded-xl bg-[url('/images/opai-img-46.png')] bg-cover bg-center md:h-[600px] lg:h-[770px]"
        ></div>

        <!-- content  -->
        <div
          class="relative w-full max-w-full overflow-hidden p-6 lg:p-[42px]"
          aria-labelledby="team-member-heading"
        >
          <div
            class="flex flex-col items-center justify-between gap-x-4 gap-y-6 md:flex-row md:gap-y-0"
          >
            <!-- left content -->
            <div
              class="border-stroke-3/18 basis-1/2 space-y-4 border-b pb-4 md:border-r md:border-b-0 md:pb-0"
            >
              <div class="space-y-1">
                <p
                  data-opai-animate
                  data-delay="0.2"
                  class="font-inter-tight text-tagline-3 font-normal text-white/50"
                >
                  Senior Data Analyst
                </p>
                <h2
                  data-opai-animate
                  data-delay="0.3"
                  class="font-instrument-serif text-is-heading-5 font-normal text-white/90"
                >
                  Mia Thompson
                </h2>
              </div>

              <p
                data-opai-animate
                data-delay="0.4"
                class="font-inter-tight text-tagline-3 mr-5 font-normal text-white/60 lg:mr-0"
              >
                Mia transforms complex data into actionable insights that drive smarter decisions.
              </p>
            </div>

            <!-- right content -->
            <div class="w-full space-y-5.5 md:basis-1/2">
              <div class="space-y-2">
                <h2
                  data-opai-animate
                  data-delay="0.3"
                  class="font-instrument-serif text-is-heading-5 font-normal text-white/90"
                >
                  Contact information
                </h2>
                <p
                  data-opai-animate
                  data-delay="0.4"
                  class="font-inter-tight text-tagline-3 font-normal text-white/60"
                >
                  <span class="mb-1">mia.thompson@company.com</span> <br />
                  <span>+1 (368) 567 89 54</span>
                </p>
              </div>
              <div data-opai-animate data-delay="0.5">
                <Component src="src/components/shared/social-icons.htm" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
