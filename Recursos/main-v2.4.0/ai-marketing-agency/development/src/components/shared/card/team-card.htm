<div
  class="border-stroke-1/10 group bg-background-5 {=$class} relative h-[420px] w-full overflow-hidden rounded-lg border"
  aria-label="Team member profile"
>
  <figure
    class="size-full overflow-hidden rounded-lg grayscale-100 transition-all duration-400 group-hover:grayscale-0"
  >
    <img
      src="{=$image}"
      alt="{=$name}, {=$position}"
      class="size-full object-cover"
    />
  </figure>
  <a href="./team-details.html" class="text-center">
    <div
      class="bg-background-13/80 ease-team-ease-1 absolute bottom-[15px] left-1/2 w-[calc(100%-30px)] -translate-x-1/2 space-y-0.5 rounded-md p-5 backdrop-blur-[12px] transition-all duration-400 md:bottom-5 md:w-[calc(100%-40px)] lg:translate-y-[30%] lg:scale-[90%] lg:opacity-0 lg:group-hover:translate-y-0 lg:group-hover:scale-100 lg:group-hover:opacity-100"
    >
      <h3 class="text-manrope-heading-6 font-medium text-white/80">{=$name}</h3>
      <p class="text-tagline-4 text-center font-normal text-white/50">
        {=$position}
      </p>
    </div>
  </a>
</div>
