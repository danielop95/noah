<!-- follow us  -->
<section class="bg-background-7 py-20 md:py-30 lg:py-44">
  <div class="main-container">
    <div class="space-y-[70px]">
      <div class="space-y-3 text-center">
        <h2
          data-opai-animate
          data-delay="0.1"
          class="font-instrument-serif text-is-heading-4 md:text-is-heading-3 lg:text-it-heading-2 text-background-13/90"
        >
          Follow us on social media
        </h2>
        <p
          data-opai-animate
          data-delay="0.2"
          class="font-inter-tight text-tagline-2 text-background-13/60"
        >
          Stay connected with us and explore the latest AI trends:
        </p>
      </div>

      <!-- cards -->
      <div
        class="mx-auto grid max-w-[850px] grid-cols-12 items-center justify-center gap-y-6 md:gap-x-8 md:gap-y-0"
      >
        <!-- card one  -->
        <div data-opai-animate data-delay="0.3" class="col-span-12 md:col-span-4">
          <div
            class="border-stroke-3/18 space-y-6 rounded-lg border bg-white p-6 text-center transition-transform duration-450 ease-in-out hover:scale-105 lg:p-14"
          >
            <span class="mx-auto flex size-9 items-center justify-center">
              <Component src="src/components/shared/icon/linkedin.htm" class="mx-auto" />
            </span>
            <p
              class="font-inter-tight text-tagline-1 text-background-13/90 font-normal text-nowrap"
            >
              <a
                href="https://linkedin.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Follow Nexsas on LinkedIn (opens in new tab)"
              >
                Linkedin: <span class="text-background-13/60">@Nexsas</span>
              </a>
            </p>
          </div>
        </div>

        <!-- card two  -->
        <div data-opai-animate data-delay="0.4" class="col-span-12 md:col-span-4">
          <div
            class="border-stroke-3/18 space-y-6 rounded-lg border bg-white p-6 text-center transition-transform duration-450 ease-in-out hover:scale-105 lg:p-14"
          >
            <span class="mx-auto flex size-9 items-center justify-center">
              <Component
                src="src/components/shared/icon/x-icon.htm"
                class="stroke-background-6 size-full fill-none"
              />
            </span>
            <p
              class="font-inter-tight text-tagline-1 text-background-13/90 font-normal text-nowrap"
            >
              <a
                href="https://x.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Follow Nexsas on X / Twitter (opens in new tab)"
              >
                Twitter: <span class="text-background-13/60">@Nexsas</span>
              </a>
            </p>
          </div>
        </div>
        <!-- card three  -->
        <div data-opai-animate data-delay="0.5" class="col-span-12 md:col-span-4">
          <div
            class="border-stroke-3/18 space-y-6 rounded-lg border bg-white p-6 text-center transition-transform duration-450 ease-in-out hover:scale-105 lg:p-14"
          >
            <span class="mx-auto flex size-9 items-center justify-center">
              <Component
                src="src/components/shared/icon/instagram.htm"
                class="stroke-background-6 mx-auto fill-none"
              />
            </span>
            <p
              class="font-inter-tight text-tagline-1 text-background-13/90 font-normal text-nowrap"
            >
              <a
                href="https://instagram.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Follow Nexsas on Instagram (opens in new tab)"
              >
                Instagram: <span class="text-background-13/60">@Nexsas</span>
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
