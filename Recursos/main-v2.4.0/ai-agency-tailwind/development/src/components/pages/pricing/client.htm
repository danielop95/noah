<!-- =========================
Client Feedback section
===========================-->
<section>
  <div
    data-ns-animate
    data-delay="0.2"
    class="main-container bg-background-3 dark:bg-background-5 relative z-0 overflow-hidden rounded-4xl py-[100px] text-center"
  >
    <div
      class="pointer-events-none absolute -top-[164%] -left-[35%] -z-10 h-full w-full rotate-21 select-none"
      aria-hidden="true"
    >
      <img
        src="./images/ns-img-498.png"
        alt="Decorative gradient background overlay"
        class="scale-[60%]"
      />
    </div>

    <!-- Customer Testimonial -->
    <article class="space-y-4 pb-10 text-center">
      <!-- Customer Avatars -->
      <div class="flex cursor-pointer justify-center -space-x-2.5">
        <img
          class="ring-accent bg-ns-yellow inline-block size-[38px] rounded-full ring-2 dark:ring-black"
          src="./images/ns-avatar-1.png"
          alt="Customer avatar 1"
          width="38"
          height="38"
        />
        <img
          class="ring-accent bg-ns-red inline-block size-[38px] rounded-full ring-2 dark:ring-black"
          src="./images/ns-avatar-2.png"
          alt="Customer avatar 2"
          width="38"
          height="38"
        />
        <img
          class="ring-accent bg-ns-green relative z-0 inline-block size-[38px] rounded-full ring-2 dark:ring-black"
          src="./images/ns-avatar-3.png"
          alt="Customer avatar 3"
          width="38"
          height="38"
        />
        <div
          class="bg-ns-cyan ring-accent text-secondary/80 dark:text-accent/80 text-tagline-3 relative z-10 inline-flex size-[38px] items-center justify-center rounded-full font-medium ring-2 dark:ring-black"
        >
          99+
        </div>
      </div>

      <!-- Trust Metrics -->
      <div>
        <p class="text-tagline-2 text-secondary dark:text-accent font-medium">Tushed by 20k+</p>
        <p class="text-tagline-3">Customers Across the Globe</p>
      </div>
    </article>

    <!-- Client Logos -->
    <div class="relative mx-auto max-w-[1130px]">
      <div
        class="from-background-3 dark:from-background-5 absolute top-5 left-0 z-40 h-full w-[7%] bg-linear-to-r to-transparent"
      ></div>
      <div
        class="from-background-3 dark:from-background-5 absolute top-5 right-0 z-40 h-full w-[7%] bg-linear-to-l to-transparent"
      ></div>

      <div class="logos-marquee-container">
        <div
          class="border-secondary/10 dark:border-accent/10 flex items-center justify-center gap-8 border-t pt-10"
        >
          <figure class="ml-8 min-w-[140px] md:min-w-[201px]">
            <img
              src="./images/icons/client-logo-6.svg"
              alt="Client company logo 1"
              class="inline-block lg:w-auto dark:hidden"
              width="120"
              height="40"
            />

            <img
              src="./images/icons/client-logo-6-dark.svg"
              alt="Client company logo 1"
              class="hidden lg:w-auto dark:block"
              width="120"
              height="40"
            />
          </figure>
          <figure class="min-w-[140px] md:min-w-[201px]">
            <img
              src="./images/icons/client-logo-7.svg"
              alt="Client company logo 2"
              class="inline-block lg:w-auto dark:hidden"
              width="120"
              height="40"
            />
            <img
              src="./images/icons/client-logo-7-dark.svg"
              alt="Client company logo 2"
              class="hidden lg:w-auto dark:block"
              width="120"
              height="40"
            />
          </figure>
          <figure class="min-w-[140px] md:min-w-[201px]">
            <img
              src="./images/icons/client-logo-8.svg"
              alt="Client company logo 3"
              class="inline-block lg:w-auto dark:hidden"
              width="120"
              height="40"
            />
            <img
              src="./images/icons/client-logo-8-dark.svg"
              alt="Client company logo 3"
              class="hidden lg:w-auto dark:block"
              width="120"
              height="40"
            />
          </figure>
          <figure class="min-w-[140px] md:min-w-[201px]">
            <img
              src="./images/icons/client-logo-9.svg"
              alt="Client company logo 4"
              class="inline-block lg:w-auto dark:hidden"
              width="120"
              height="40"
            />
            <img
              src="./images/icons/client-logo-9-dark.svg"
              alt="Client company logo 4"
              class="hidden lg:w-auto dark:block"
              width="120"
              height="40"
            />
          </figure>
          <figure class="min-w-[140px] md:min-w-[201px]">
            <img
              src="./images/icons/client-logo-10.svg"
              alt="Client company logo 5"
              class="inline-block lg:w-auto dark:hidden"
              width="120"
              height="40"
            />
            <img
              src="./images/icons/client-logo-10-dark.svg"
              alt="Client company logo 5"
              class="hidden lg:w-auto dark:block"
              width="120"
              height="40"
            />
          </figure>
        </div>
      </div>
    </div>
  </div>
</section>
