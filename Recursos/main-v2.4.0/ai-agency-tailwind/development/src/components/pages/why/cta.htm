<section class="py-16 lg:py-22 xl:py-28">
  <div class="main-container">
    <div
      data-ns-animate
      data-delay="0.1"
      class="bg-background-12 dark:bg-background-8 relative z-0 mx-auto flex flex-col items-center justify-center space-y-8 overflow-hidden rounded-4xl px-5 py-28 text-center"
    >
      <figure
        class="pointer-events-none absolute -bottom-10 -left-[10%] select-none md:-left-[5%] lg:left-0"
        data-ns-animate
        data-delay="0.3"
        data-direction="left"
        data-offset="90"
        data-spring="true"
        data-duration="2.4"
      >
        <img
          src="./images/ns-img-336.svg"
          alt="cta"
          class="pointer-events-none select-none max-sm:scale-75"
        />
      </figure>
      <figure
        class="pointer-events-none absolute top-0 -right-[16%] select-none md:-right-[10%] lg:right-0"
        data-ns-animate
        data-delay="0.3"
        data-direction="right"
        data-offset="90"
        data-spring="true"
        data-duration="2.4"
      >
        <img
          src="./images/ns-img-337.svg"
          alt="cta"
          class="pointer-events-none select-none max-sm:scale-75"
        />
      </figure>
      <div class="space-y-2">
        <h2 data-ns-animate data-delay="0.1">
          Speed up compliance and <br class="max-md:hidden" />
          accelerate growth
        </h2>
        <p data-ns-animate data-delay="0.2">
          Create a resume that’s tailored, professional, and ready to
          <br class="hidden lg:block" />
          impress—powered by NestSaaS.
        </p>
      </div>

      <ul
        class="mx-auto flex flex-col items-center justify-center gap-4 max-md:w-full md:mx-0 md:w-auto md:flex-row"
      >
        <li
          data-ns-animate
          data-delay="0.3"
          data-direction="left"
          data-offset="50"
          class="w-[90%] list-none sm:w-auto"
        >
          <a
            href="./signup.html"
            class="btn btn-secondary hover:btn-primary dark:hover:btn-primary dark:btn-accent btn-lg md:btn-xl mx-auto w-full md:mx-0 md:w-auto"
          >
            <span>Get started</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>
